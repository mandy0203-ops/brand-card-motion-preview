<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金句卡｜Keynote 構圖試作</title>
<style>
:root{font-family:"Noto Sans CJK TC","PingFang TC",sans-serif;background:#2E3E3A;color:#F5F2E8}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1120px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}h1{font:700 clamp(23px,3vw,36px) "Noto Serif CJK TC","Songti TC",serif;margin:0}.top p{font-size:12px;color:#D0DDD9;margin:0}
.stage{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#2E3E3A}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage[data-bg="plain"] .photo{display:none}
.photo-label{position:absolute;top:3%;left:4%;font-size:10px;letter-spacing:.12em;color:#FFF;background:#2E3E3A;padding:4px 7px}.stage[data-bg="plain"] .photo-label{display:none}
.card-wrap{position:absolute;right:6%;bottom:8.2%;width:62%;max-width:62%}
.seal{position:absolute;left:-10.5%;top:-10%;width:17%;height:77%;background:radial-gradient(115% 110% at 14% 9%,#A9844C 0%,#765831 56%,#493B2C 100%);color:#F9ECC3;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:8% 0 0 2%;overflow:hidden}
.seal::after{content:"";position:absolute;left:17%;bottom:13%;width:66%;height:1px;background:#D9BC7B;opacity:.65}.seal-mark{font:400 clamp(35px,5.3vw,65px)/1 Georgia,serif;letter-spacing:-.08em}.seal-name{font:600 clamp(6px,.7vw,9px) Arial,sans-serif;letter-spacing:.22em;writing-mode:vertical-rl;margin-top:11px}
.card{position:relative;border-radius:7px;background:radial-gradient(155% 185% at 12% 2%,rgba(255,255,255,.98) 0%,rgba(245,242,232,.96) 46%,rgba(208,221,217,.91) 100%);color:#2E3E3A;padding:30px 34px;min-height:143px;display:flex;align-items:center}
.quote{font:600 clamp(19px,2.55vw,31px)/1.52 "Noto Sans CJK TC","PingFang TC",sans-serif;letter-spacing:.02em;margin:0;text-wrap:pretty}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{appearance:none;border:1px solid #6B8F88;background:transparent;color:#F5F2E8;padding:9px 13px;font:600 13px "Noto Sans CJK TC",sans-serif;cursor:pointer}button[aria-pressed="true"]{background:#F5F2E8;color:#2E3E3A}.note{font-size:13px;line-height:1.7;color:#D0DDD9;margin:16px 0 0}
@media(max-width:700px){body{padding:14px}.top{display:block}.top p{margin-top:8px}.card-wrap{right:5%;bottom:8%;width:63%;max-width:63%}.card{border-radius:3px;padding:10px 12px;min-height:0}.quote{font-size:clamp(8px,1.65vw,14px);line-height:1.4}.seal{padding-top:9%}.seal-mark{font-size:17px}.seal-name{font-size:4px;margin-top:2px}.seal::after{bottom:10%}}
</style>
<main>
<div class="top"><h1>金句卡｜Keynote 構圖試作</h1><p>右下角 · 暖白灰／古銅金 · 獨立試作</p></div>
<div class="stage" id="stage" data-bg="photo">
<img class="photo" src="./訪談實拍_文森_C0122.jpg" alt="雙人訪談畫面示意">
<div class="photo-label">訪談畫面示意 · 下方文字非本段原話</div>
<div class="card-wrap"><div class="seal" aria-hidden="true"><span class="seal-mark">“</span><span class="seal-name">WORTH REMEMBERING</span></div><div class="card"><p class="quote" id="quote"></p></div></div>
</div>
<div class="controls" role="group" aria-label="試看文字"><button data-text="0" aria-pressed="true">Keynote 長句</button><button data-text="1" aria-pressed="false">中句</button><button data-text="2" aria-pressed="false">短句</button><button data-bg="photo" aria-pressed="true">訪談畫面</button><button data-bg="plain" aria-pressed="false">純色畫面</button></div>
<p class="note">依 Keynote 草圖重新設計的金句卡試作，文案不是訪談逐字稿。右下角既有 04 咖啡塊維持原樣；這一版供比較。</p>
</main>
<script>
const texts=["當發現可以改善的事情，最該高興的，是不用再抱持著錯誤的想法，繼續生活下去。","好的關係，容得下彼此不同的聲音。","先聽，再說。"];
const quote=document.getElementById("quote"),stage=document.getElementById("stage");
function setText(i){quote.textContent=texts[i];document.querySelectorAll("button[data-text]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.text)===i)))}
document.querySelectorAll("button[data-text]").forEach(b=>b.addEventListener("click",()=>setText(Number(b.dataset.text))));
document.querySelectorAll("button[data-bg]").forEach(b=>b.addEventListener("click",()=>{stage.dataset.bg=b.dataset.bg;document.querySelectorAll("button[data-bg]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
setText(0);
</script>
</html>
