<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金句卡｜Keynote 構圖試作</title>
<style>
:root{font-family:"Noto Sans CJK TC","PingFang TC",sans-serif;background:#2E3E3A;color:#F5F2E8}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1120px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}h1{font:700 clamp(23px,3vw,36px) "Noto Serif CJK TC","Songti TC",serif;margin:0}.top p{font-size:12px;color:#D0DDD9;margin:0}
.stage{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#2E3E3A}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage[data-bg="plain"] .photo{display:none}
.photo-label{position:absolute;top:3%;left:4%;font-size:10px;letter-spacing:.12em;color:#FFF;background:#2E3E3A;padding:4px 7px}.stage[data-bg="plain"] .photo-label{display:none}
.card-wrap{position:absolute;right:5.2%;bottom:8.5%;width:max-content;max-width:51%;min-width:34%;filter:none}
.gold-mark{position:absolute;left:-34px;top:-22px;width:65px;height:65px;background:#F9ECC3;color:#8B4A2A;display:flex;align-items:center;justify-content:center;font:700 40px Georgia,serif;line-height:1}
.card{position:relative;background:rgba(237,217,204,.95);color:#2E3E3A;padding:26px;min-width:100%;border-radius:0}
.rule{width:38px;height:3px;background:#8B4A2A;margin:0 0 12px}
.eyebrow{font:700 clamp(8px,.75vw,11px) Arial,sans-serif;letter-spacing:.19em;color:#8B4A2A;margin:0 0 10px}
.quote{font:700 clamp(14px,2.05vw,31px)/1.45 "Noto Serif CJK TC","Songti TC",serif;letter-spacing:.015em;margin:0;max-width:29em;text-wrap:balance}
.foot{font:600 clamp(7px,.68vw,10px) Arial,sans-serif;letter-spacing:.12em;color:#8B4A2A;margin-top:14px;text-align:right}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{appearance:none;border:1px solid #6B8F88;background:transparent;color:#F5F2E8;padding:9px 13px;font:600 13px inherit;cursor:pointer}button[aria-pressed="true"]{background:#F5F2E8;color:#2E3E3A}.note{font-size:13px;line-height:1.7;color:#D0DDD9;margin:16px 0 0}
@media(max-width:700px){body{padding:14px}.top{display:block}.top p{margin-top:8px}.card{padding:9px}.card-wrap{max-width:52%;min-width:39%;bottom:8%}.gold-mark{left:-13px;top:-10px;width:23px;height:23px;font-size:15px}.rule{width:18px;height:2px;margin-bottom:4px}.eyebrow{font-size:5px;margin-bottom:4px;letter-spacing:.07em}.quote{font-size:clamp(7px,1.6vw,13px);line-height:1.25}.foot{font-size:5px;margin-top:5px}}
</style>
<main>
<div class="top"><h1>金句卡｜Keynote 構圖試作</h1><p>右下角 · 暖棕／淺暖棕／溫金 · 獨立試作</p></div>
<div class="stage" id="stage" data-bg="photo">
<img class="photo" src="./訪談實拍_文森_C0122.jpg" alt="雙人訪談畫面示意">
<div class="photo-label">訪談畫面示意 · 下方文字非本段原話</div>
<div class="card-wrap"><div class="gold-mark" aria-hidden="true">“</div><div class="card"><div class="rule"></div><p class="eyebrow">WORTH REMEMBERING</p><p class="quote" id="quote"></p><div class="foot">SMOKEY JADE · QUOTE 01</div></div></div>
</div>
<div class="controls" role="group" aria-label="試看文字"><button data-text="0" aria-pressed="true">Keynote 長句</button><button data-text="1" aria-pressed="false">中句</button><button data-text="2" aria-pressed="false">短句</button><button data-bg="photo" aria-pressed="true">訪談畫面</button><button data-bg="plain" aria-pressed="false">純色畫面</button></div>
<p class="note">這是依 Keynote 草圖重新設計的金句卡試作，並非訪談逐字稿。右下角既有 04 咖啡塊維持原樣；這一版供比較。</p>
</main>
<script>
const texts=["當發現可以改善的事情，最該高興的，是不用再抱持著錯誤的想法，繼續生活下去。","好的關係，容得下彼此不同的聲音。","先聽，再說。"];
const quote=document.getElementById("quote"),stage=document.getElementById("stage");
function setText(i){quote.textContent=texts[i];document.querySelectorAll("button[data-text]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.text)===i)))}
document.querySelectorAll("button[data-text]").forEach(b=>b.addEventListener("click",()=>setText(Number(b.dataset.text))));
document.querySelectorAll("button[data-bg]").forEach(b=>b.addEventListener("click",()=>{stage.dataset.bg=b.dataset.bg;document.querySelectorAll("button[data-bg]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
setText(0);
</script>
</html>
