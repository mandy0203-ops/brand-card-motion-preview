<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金句卡｜Keynote 構圖試作</title>
<style>
:root{font-family:"Noto Sans CJK TC","PingFang TC",sans-serif;background:#2E3E3A;color:#F5F2E8}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1120px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}h1{font:700 clamp(23px,3vw,36px) "Noto Serif CJK TC","Songti TC",serif;margin:0}.top p{font-size:12px;color:#D0DDD9;margin:0}
.stage{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#2E3E3A}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage[data-bg="plain"] .photo{display:none}
.photo-label{position:absolute;top:3%;left:4%;font-size:10px;letter-spacing:.12em;color:#FFF;background:#2E3E3A;padding:4px 7px}.stage[data-bg="plain"] .photo-label{display:none}
.card-wrap{position:absolute;right:6%;bottom:8.2%;width:max-content;max-width:46%;cursor:grab;touch-action:none;user-select:none}.card-wrap.dragging{cursor:grabbing}
.motif{position:absolute;left:-11%;bottom:-17%;width:27%;aspect-ratio:1/1;height:auto;pointer-events:none}
.motif-upper{position:absolute;right:0;top:0;width:67%;height:72%;background:radial-gradient(125% 105% at 86% 12%,rgba(249,236,195,.85),rgba(171,135,72,.57) 50%,rgba(117,88,45,.43) 100%)}
.motif-lower{position:absolute;left:0;bottom:0;width:79%;height:78%;border-bottom-left-radius:68%;background:radial-gradient(115% 115% at 22% 8%,rgba(250,232,177,.8),rgba(159,123,63,.63) 52%,rgba(107,79,43,.54) 100%)}
.motif-upper,.motif-lower{pointer-events:auto;cursor:move;touch-action:none;transform-origin:center}
.motif-mark{position:absolute;left:13%;top:35%;font:400 1px/1 Georgia,serif;color:#FFF9E8;opacity:.94}
.card{position:relative;border-radius:7px;background:radial-gradient(155% 185% at 12% 2%,rgba(255,255,255,.98) 0%,rgba(245,242,232,.96) 46%,rgba(208,221,217,.91) 100%);color:#2E3E3A;padding:22px 26px;min-height:0;display:flex;align-items:center}
.quote{font:600 clamp(16px,1.8vw,22px)/1.45 "Noto Sans CJK TC","PingFang TC",sans-serif;letter-spacing:.02em;margin:0;text-wrap:pretty}
.resize-handle{position:absolute;right:-7px;bottom:-7px;width:20px;height:20px;background:#8B4A2A;border:2px solid #F5F2E8;cursor:nwse-resize;touch-action:none;z-index:2}.resize-handle::after{content:"↘";display:block;color:#fff;font:700 13px Arial,sans-serif;text-align:center;line-height:15px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{appearance:none;border:1px solid #6B8F88;background:transparent;color:#F5F2E8;padding:9px 13px;font:600 13px "Noto Sans CJK TC",sans-serif;cursor:pointer}button[aria-pressed="true"]{background:#F5F2E8;color:#2E3E3A}.note{font-size:13px;line-height:1.7;color:#D0DDD9;margin:16px 0 0}
.editor{margin-top:18px;border-top:1px solid #6B8F88;padding-top:16px}.editor h2{font-size:18px;margin:0 0 6px}.editor-hint{font-size:13px;line-height:1.6;color:#D0DDD9;margin:0 0 15px}.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}.control output{color:#F9ECC3}.control input[type="range"]{width:100%;accent-color:#F9ECC3}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{display:grid;gap:6px;font-size:13px}.field input,.field select,.field textarea{width:100%;background:#F5F2E8;color:#2E3E3A;border:0;border-radius:0;padding:9px;font:14px "Noto Sans CJK TC",sans-serif}.field textarea{min-height:68px;resize:vertical}.editor-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.editor-status{font-size:12px;color:#F9ECC3}
.gold-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.gold-group{border:1px solid #6B8F88;padding:12px}.gold-group legend{color:#F9ECC3;font-size:13px;padding:0 6px}.gold-group .sliders{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.gold-target{font-size:13px;color:#F9ECC3;margin:18px 0 -8px}.copy-output{margin-top:12px}.copy-output textarea{min-height:150px;font-size:13px;line-height:1.6}[hidden]{display:none!important}
@media(max-width:700px){.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}.fields,.gold-controls{grid-template-columns:1fr}.resize-handle{width:13px;height:13px;right:-4px;bottom:-4px;border-width:1px}.resize-handle::after{font-size:8px;line-height:10px}}
@media(max-width:700px){body{padding:14px}.top{display:block}.top p{margin-top:8px}.card-wrap{right:5%;bottom:8%;width:max-content;max-width:46%}.card{border-radius:3px;padding:10px 12px;min-height:0}.quote{font-size:clamp(8px,1.65vw,14px);line-height:1.4}}
</style>
<main>
<div class="top"><h1>金句卡｜Keynote 構圖試作</h1><p>右下角 · 暖白灰／古銅金 · 獨立試作</p></div>
<div class="stage" id="stage" data-bg="photo">
<img class="photo" src="./訪談實拍_文森_C0122.jpg" alt="雙人訪談畫面示意">
<div class="photo-label">訪談畫面示意 · 下方文字非本段原話</div>
<div class="card-wrap" id="card-wrap" aria-label="可拖動字卡"><div class="motif" id="motif" aria-hidden="true"><div class="motif-upper" id="motif-upper"></div><div class="motif-lower" id="motif-lower"></div><span class="motif-mark">“</span></div><div class="card" id="card"><p class="quote" id="quote"></p></div><div class="resize-handle" id="resize-handle" role="slider" aria-label="拖動調整字卡寬度" aria-valuemin="20" aria-valuemax="65" aria-valuenow="46" tabindex="0"></div></div>
</div>
<div class="controls" role="group" aria-label="試看文字"><button data-text="0" aria-pressed="true">Keynote 長句</button><button data-text="1" aria-pressed="false">中句</button><button data-text="2" aria-pressed="false">短句</button><button data-bg="photo" aria-pressed="true">訪談畫面</button><button data-bg="plain" aria-pressed="false">純色畫面</button></div>
<section class="editor" aria-label="字卡調整介面"><h2>自己拉拉看</h2><p class="editor-hint">在畫面上拖動字卡可換位置，拖右下角的小方塊可調寬度。露出的兩塊金色也能各自拖動，或用下方滑桿微調；長句、中句、短句的金色位置各自記住，切換按鈕會帶出那一組；完成後按「複製修改指令」，會一次列出三組，貼回對話給我。</p>
<div class="sliders">
<div class="control"><label for="right">距右邊 <output id="right-value"></output></label><input id="right" type="range" min="0" max="60" step="1"></div>
<div class="control"><label for="bottom">距下邊 <output id="bottom-value"></output></label><input id="bottom" type="range" min="0" max="55" step="1"></div>
<div class="control"><label for="width">字卡寬度上限 <output id="width-value"></output></label><input id="width" type="range" min="20" max="65" step="1"></div>
<div class="control"><label for="font">中文字大小 <output id="font-value"></output></label><input id="font" type="range" min="16" max="34" step="1"></div>
<div class="control"><label for="panel">文字板透明度 <output id="panel-value"></output></label><input id="panel" type="range" min="55" max="100" step="1"></div>
<div class="control"><label for="cardRadius">白色板塊圓角 <output id="cardRadius-value"></output></label><input id="cardRadius" type="range" min="0" max="50" step="1"></div>
<div class="control"><label for="gold">金色濃淡 <output id="gold-value"></output></label><input id="gold" type="range" min="20" max="100" step="1"></div>
</div>
<p class="gold-target" id="gold-target"></p>
<div class="gold-controls"><fieldset class="gold-group"><legend>上方金色方塊</legend><div class="sliders"><div class="control"><label for="upperX">左右 <output id="upperX-value"></output></label><input id="upperX" type="range" min="-100" max="100" step="1"></div><div class="control"><label for="upperY">上下 <output id="upperY-value"></output></label><input id="upperY" type="range" min="-100" max="100" step="1"></div><div class="control"><label for="upperScale">大小 <output id="upperScale-value"></output></label><input id="upperScale" type="range" min="50" max="180" step="1"></div><div class="control"><label for="upperAlpha">透明度 <output id="upperAlpha-value"></output></label><input id="upperAlpha" type="range" min="0" max="100" step="1"></div><div class="control"><label for="upperRadius">邊角圓弧 <output id="upperRadius-value"></output></label><input id="upperRadius" type="range" min="0" max="60" step="1"></div><div class="control"><label for="upperAngle">傾斜角度 <output id="upperAngle-value"></output></label><input id="upperAngle" type="range" min="-30" max="30" step="1"></div></div></fieldset><fieldset class="gold-group"><legend>下方金色弧形</legend><div class="sliders"><div class="control"><label for="lowerX">左右 <output id="lowerX-value"></output></label><input id="lowerX" type="range" min="-100" max="100" step="1"></div><div class="control"><label for="lowerY">上下 <output id="lowerY-value"></output></label><input id="lowerY" type="range" min="-100" max="100" step="1"></div><div class="control"><label for="lowerScale">大小 <output id="lowerScale-value"></output></label><input id="lowerScale" type="range" min="50" max="180" step="1"></div><div class="control"><label for="lowerAlpha">透明度 <output id="lowerAlpha-value"></output></label><input id="lowerAlpha" type="range" min="0" max="100" step="1"></div><div class="control"><label for="lowerCurve">左下圓弧 <output id="lowerCurve-value"></output></label><input id="lowerCurve" type="range" min="0" max="100" step="1"></div><div class="control"><label for="lowerAngle">傾斜角度 <output id="lowerAngle-value"></output></label><input id="lowerAngle" type="range" min="-30" max="30" step="1"></div></div></fieldset></div>
<div class="fields"><label class="field">文字板色調<select id="material"><option value="ivory">暖白灰</option><option value="jade">淺煙玉</option><option value="umber">淺暖棕</option></select></label><label class="field">試放文字<input id="custom-text" type="text" placeholder="在這裡輸入你要看的金句"></label></div>
<label class="field" style="margin-top:12px">還想怎麼改？<textarea id="feedback" placeholder="例如：金色再淡一些、字更細、往上移一點"></textarea></label>
<div class="editor-actions"><button id="copy-request" type="button">複製修改指令</button><button id="reset" type="button">恢復這版預設值</button><span class="editor-status" id="editor-status" role="status"></span></div>
<label class="field copy-output" id="copy-output-wrap" hidden>剛剛複製的內容（可在這裡檢查；若沒複製成功，全選後手動複製）<textarea id="copy-output" readonly></textarea></label></section>
<p class="note">這是依 Keynote 草圖製作的獨立試作，文案不是訪談逐字稿。調整只存在這個預覽頁，原本選定的 04 咖啡塊及剪輯時間線都不會受影響。</p>
</main>
<script>
const texts=["當發現可以改善的事情，最該高興的，是不用再抱持著錯誤的想法，繼續生活下去。","好的關係，容得下彼此不同的聲音。","先聽，再說。"];
const lengthNames=["長句","中句","短句"];
const STORE="keynote-quote-editor-v2";
const stage=document.getElementById("stage"),wrap=document.getElementById("card-wrap"),card=document.getElementById("card"),quote=document.getElementById("quote"),motif=document.getElementById("motif"),upper=document.getElementById("motif-upper"),lower=document.getElementById("motif-lower"),handle=document.getElementById("resize-handle"),editorStatus=document.getElementById("editor-status"),goldTarget=document.getElementById("gold-target"),copyOutputWrap=document.getElementById("copy-output-wrap"),copyOutput=document.getElementById("copy-output");
const motifKeys=[];for(const name of ["upper","lower"])for(const suffix of ["X","Y","Scale","Alpha",name==="upper"?"Radius":"Curve","Angle"])motifKeys.push(name+suffix);
// 這版預設值＝2026-10-16 業主調整版：共用字卡設定一組，金色設定長／中／短句各一組
const defaults={right:48,bottom:9,width:40,font:24,panel:91,cardRadius:4,gold:86,material:"umber",background:"photo",textIndex:0,customText:"",fixedWidth:true,profiles:[
 {upperX:-16,upperY:-45,upperScale:127,upperAlpha:100,upperRadius:1,upperAngle:0,lowerX:19,lowerY:-4,lowerScale:107,lowerAlpha:100,lowerCurve:54,lowerAngle:30},
 {upperX:-37,upperY:-12,upperScale:97,upperAlpha:100,upperRadius:1,upperAngle:0,lowerX:3,lowerY:-10,lowerScale:88,lowerAlpha:100,lowerCurve:54,lowerAngle:30},
 {upperX:-37,upperY:18,upperScale:79,upperAlpha:100,upperRadius:1,upperAngle:0,lowerX:3,lowerY:17,lowerScale:73,lowerAlpha:100,lowerCurve:54,lowerAngle:30}]};
function fresh(){return {...defaults,profiles:defaults.profiles.map(p=>({...p}))}}
function useProfile(){Object.assign(state,state.profiles[state.textIndex])}
function setMotif(key,value){state[key]=value;state.profiles[state.textIndex][key]=value}
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&typeof saved==="object"){const profiles=state.profiles.map((p,i)=>({...p,...(Array.isArray(saved.profiles)&&saved.profiles[i]||{})}));state={...state,...saved,profiles}}}catch{}
if(![0,1,2].includes(state.textIndex))state.textIndex=0;
useProfile();
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}
function panelGradient(){
  const a=state.panel/100,top=Math.min(1,a+.02),end=Math.max(.1,a-.05);
  const colors={ivory:[[255,255,255],[245,242,232],[208,221,217]],jade:[[255,255,255],[208,221,217],[208,221,217]],umber:[[255,255,255],[245,242,232],[237,217,204]]}[state.material]||[[255,255,255],[245,242,232],[208,221,217]];
  const stop=(rgb,alpha)=>`rgba(${rgb.join(",")},${alpha.toFixed(2)})`;
  return `radial-gradient(155% 185% at 12% 2%,${stop(colors[0],top)} 0%,${stop(colors[1],a)} 46%,${stop(colors[2],end)} 100%)`;
}
function render(){
  stage.dataset.bg=state.background;
  quote.textContent=state.customText||texts[state.textIndex]||texts[0];
  quote.style.fontSize=Math.max(8,state.font*stage.clientWidth/1120)+"px";
  card.style.background=panelGradient();card.style.borderRadius=state.cardRadius*stage.clientWidth/1120+"px";motif.style.opacity=state.gold/100;
  for(const [name,element] of [["upper",upper],["lower",lower]]){element.style.transform=`translate(${state[name+"X"]}%,${state[name+"Y"]}%) rotate(${state[name+"Angle"]}deg) scale(${state[name+"Scale"]/100})`;element.style.opacity=state[name+"Alpha"]/100}
  upper.style.borderRadius=state.upperRadius*motif.offsetWidth/(1120*.46*.27)+"px";lower.style.borderBottomLeftRadius=state.lowerCurve+"%";
  motif.querySelector(".motif-mark").style.fontSize=motif.offsetWidth*.37+"px";
  wrap.style.width=state.fixedWidth?state.width+"%":"max-content";
  wrap.style.maxWidth=state.width+"%";
  state.right=clamp(Number(state.right)||0,0,Math.max(0,100-wrap.offsetWidth/stage.clientWidth*100));
  state.bottom=clamp(Number(state.bottom)||0,0,Math.max(0,100-wrap.offsetHeight/stage.clientHeight*100));
  wrap.style.right=state.right+"%";wrap.style.bottom=state.bottom+"%";
  for(const key of ["right","bottom","width","font","panel","cardRadius","gold"]){const input=document.getElementById(key);input.value=state[key];document.getElementById(key+"-value").textContent=Math.round(state[key])+(["font","cardRadius"].includes(key)?" px":"%")}
  for(const key of motifKeys){const suffix=key.replace(/^(upper|lower)/,"");document.getElementById(key).value=state[key];document.getElementById(key+"-value").textContent=Math.round(state[key])+(suffix==="Angle"?"°":suffix==="Radius"?" px":"%")}
  goldTarget.textContent=`下方金色滑桿目前調的是：${lengthNames[state.textIndex]}${state.customText?"（試放文字沿用這組）":""}`;
  document.getElementById("material").value=state.material;
  document.getElementById("custom-text").value=state.customText;
  handle.setAttribute("aria-valuenow",Math.round(state.width));
  document.querySelectorAll("button[data-text]").forEach(b=>b.setAttribute("aria-pressed",String(!state.customText&&Number(b.dataset.text)===state.textIndex)));
  document.querySelectorAll("button[data-bg]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.bg===state.background)));
  if(wrap.offsetHeight>stage.clientHeight*.55)editorStatus.textContent="文字偏長，請確認畫面可讀性。";
}
for(const key of ["right","bottom","width","font","panel","cardRadius","gold"]){document.getElementById(key).addEventListener("input",e=>{state[key]=Number(e.target.value);if(key==="width")state.fixedWidth=true;render();save()})}
for(const key of motifKeys){document.getElementById(key).addEventListener("input",e=>{setMotif(key,Number(e.target.value));render();save()})}
document.getElementById("material").addEventListener("change",e=>{state.material=e.target.value;render();save()});
document.getElementById("custom-text").addEventListener("input",e=>{state.customText=e.target.value;render();save()});
document.querySelectorAll("button[data-text]").forEach(b=>b.addEventListener("click",()=>{state.textIndex=Number(b.dataset.text);state.customText="";useProfile();render();save()}));
document.querySelectorAll("button[data-bg]").forEach(b=>b.addEventListener("click",()=>{state.background=b.dataset.bg;render();save()}));
let gesture=null;
wrap.addEventListener("pointerdown",e=>{if(e.target===handle||e.target===upper||e.target===lower)return;gesture={type:"move",x:e.clientX,y:e.clientY,right:state.right,bottom:state.bottom};wrap.classList.add("dragging");wrap.setPointerCapture(e.pointerId);e.preventDefault()});
handle.addEventListener("pointerdown",e=>{e.stopPropagation();gesture={type:"resize",x:e.clientX,right:state.right,width:wrap.offsetWidth/stage.clientWidth*100};state.fixedWidth=true;handle.setPointerCapture(e.pointerId);e.preventDefault()});
function updateGesture(e){if(!gesture)return;const dx=(e.clientX-gesture.x)/stage.clientWidth*100;if(gesture.type==="move"){state.right=gesture.right-dx;state.bottom=gesture.bottom-(e.clientY-gesture.y)/stage.clientHeight*100}else{state.width=clamp(gesture.width+dx,20,65);state.right=gesture.right-dx}render()}
function endGesture(){if(!gesture)return;gesture=null;wrap.classList.remove("dragging");save()}
wrap.addEventListener("pointermove",updateGesture);handle.addEventListener("pointermove",updateGesture);
wrap.addEventListener("pointerup",endGesture);handle.addEventListener("pointerup",endGesture);
wrap.addEventListener("pointercancel",endGesture);handle.addEventListener("pointercancel",endGesture);
let goldGesture=null;
for(const [name,element] of [["upper",upper],["lower",lower]]){
  element.addEventListener("pointerdown",e=>{e.stopPropagation();goldGesture={name,x:e.clientX,y:e.clientY,startX:state[name+"X"],startY:state[name+"Y"],width:element.offsetWidth,height:element.offsetHeight};element.setPointerCapture(e.pointerId);e.preventDefault()});
  element.addEventListener("pointermove",e=>{if(!goldGesture||goldGesture.name!==name)return;setMotif(name+"X",clamp(goldGesture.startX+(e.clientX-goldGesture.x)/goldGesture.width*100,-100,100));setMotif(name+"Y",clamp(goldGesture.startY+(e.clientY-goldGesture.y)/goldGesture.height*100,-100,100));render()});
  for(const event of ["pointerup","pointercancel"])element.addEventListener(event,()=>{if(goldGesture){goldGesture=null;save()}});
}
handle.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();state.fixedWidth=true;state.width=clamp(state.width+(e.key==="ArrowRight"?1:-1),20,65);render();save()});
document.getElementById("reset").addEventListener("click",()=>{state=fresh();useProfile();document.getElementById("feedback").value="";copyOutputWrap.hidden=true;editorStatus.textContent="已恢復這版預設值（10/16 調整版）";render();save()});
function motifLine(p){const r=Math.round;return `上方金色方塊：左右 ${r(p.upperX)}%、上下 ${r(p.upperY)}%、大小 ${r(p.upperScale)}%、透明度 ${r(p.upperAlpha)}%、邊角圓弧 ${r(p.upperRadius)} px、傾斜 ${r(p.upperAngle)}°；下方金色弧形：左右 ${r(p.lowerX)}%、上下 ${r(p.lowerY)}%、大小 ${r(p.lowerScale)}%、透明度 ${r(p.lowerAlpha)}%、左下圓弧 ${r(p.lowerCurve)}%、傾斜 ${r(p.lowerAngle)}°。`}
document.getElementById("copy-request").addEventListener("click",async()=>{
  const r=Math.round,extra=document.getElementById("feedback").value.trim();
  const material={ivory:"暖白灰",jade:"淺煙玉",umber:"淺暖棕"}[state.material];
  const message=[
    "請依我在「Keynote 金句卡試作」調整的畫面修改（長、中、短句各一組金色設定）：",
    `共用：字卡距右 ${r(state.right)}%、距下 ${r(state.bottom)}%、寬度${state.fixedWidth?"固定":"上限"} ${r(state.width)}%、中文字大小 ${r(state.font)}（預覽基準）、文字板透明度 ${r(state.panel)}%、白色板塊圓角 ${r(state.cardRadius)} px、金色濃淡 ${r(state.gold)}%、色調「${material}」。`,
    ...lengthNames.map((n,i)=>`【${n}】${motifLine(state.profiles[i])}`),
    state.customText?`試放文字（沿用${lengthNames[state.textIndex]}的金色設定）：「${state.customText}」。`:"",
    extra?"另外："+extra:"",
    "請保留原本五款與已選 04 咖啡塊。"
  ].filter(Boolean).join("\n");
  copyOutput.value=message;copyOutputWrap.hidden=false;
  let ok=false;
  try{await navigator.clipboard.writeText(message);ok=true}catch{}
  if(!ok){copyOutput.focus();copyOutput.select();try{ok=document.execCommand("copy")}catch{}}
  editorStatus.textContent=ok?"已複製長、中、短三組參數！回到對話貼上即可（下方可檢查內容）。":"瀏覽器沒有允許自動複製，請在下方框內全選後手動複製。";
});
new ResizeObserver(()=>render()).observe(stage);
render();
</script>
</html>
