<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提問卡｜文字揭露動態原型</title>
<style>
  :root{color-scheme:dark;font-family:"Noto Sans CJK TC","PingFang TC",sans-serif;background:#18211f;color:#f5f2e8}
  *{box-sizing:border-box}body{margin:0;padding:32px;min-height:100vh}
  main{max-width:1120px;margin:auto}.eyebrow{color:#c98a5e;font-size:12px;letter-spacing:.25em;font-weight:700}
  h1{font:700 clamp(26px,4vw,44px) "Noto Serif CJK TC",serif;margin:10px 0 8px}
  .intro{color:#b7c3bd;margin:0 0 24px;line-height:1.7}
  .frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(90% 120% at 65% 30%,#354840,#1b2723 62%,#111b18);border:1px solid #65756d}
  .ambient{position:absolute;right:12%;top:10%;width:22%;height:88%;border-radius:48% 48% 15% 15%;background:linear-gradient(90deg,#1b2b27,#465a50 40%,#263630);filter:blur(28px);opacity:.62}
  .frame-note{position:absolute;right:3%;top:5%;color:#c6cec8;font:500 10px "Noto Sans CJK TC",sans-serif;letter-spacing:.15em;opacity:.7}
  .safe{position:absolute;left:6%;bottom:14%;max-width:86%}
  .card{width:max-content;max-width:100%;padding:22px;background:radial-gradient(150% 130% at 18% 12%,rgba(96,124,115,.93),rgba(66,89,81,.92) 52%,rgba(48,66,59,.93));border:0;border-radius:0;box-shadow:none;overflow:hidden;animation:panel-in .42s cubic-bezier(.2,.75,.2,1) both,panel-out .48s ease-in 3.22s forwards}
  .label-wrap,.question-wrap{overflow:hidden}.label{font:600 clamp(10px,1.35vw,15px) "Helvetica Neue",Arial,sans-serif;letter-spacing:.4em;color:rgba(245,242,232,.78);white-space:nowrap;animation:word-in .48s cubic-bezier(.2,.8,.2,1) .2s both}
  .question{font:700 clamp(23px,3.35vw,38px)/1.25 "Noto Serif CJK TC","Songti TC",serif;letter-spacing:.03em;color:#fbf7ef;white-space:nowrap;margin-top:12px;animation:word-in .62s cubic-bezier(.16,1,.3,1) .34s both,word-out .38s ease-in 3.08s forwards}
  .rule{width:100%;height:2px;background:#c98a5e;margin-top:14px;transform-origin:left;animation:rule-in .46s ease-out .63s both}
  @keyframes panel-in{from{clip-path:inset(0 100% 0 0);transform:translateX(-16px)}to{clip-path:inset(0);transform:translateX(0)}}
  @keyframes word-in{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes rule-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes word-out{to{transform:translateY(-110%);opacity:0}}
  @keyframes panel-out{to{clip-path:inset(0 0 0 100%);opacity:0}}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
  button{appearance:none;background:#30443e;color:#f5f2e8;border:1px solid #6b8177;border-radius:0;padding:10px 16px;font:600 15px inherit;cursor:pointer}
  button:hover,button[aria-pressed="true"]{background:#f5f2e8;color:#24342e}
  .status{margin-left:auto;color:#b7c3bd;font-size:13px}
  .details{display:flex;gap:28px;flex-wrap:wrap;color:#aebdb4;font-size:13px;line-height:1.7;margin-top:18px}
  .details strong{color:#f5f2e8}
  @media(max-width:700px){body{padding:18px}.card{padding:10px}.question{font-size:clamp(12px,3.35vw,24px);margin-top:5px}.label{font-size:8px}.rule{margin-top:6px;height:1px}.controls .status{width:100%;margin-left:0}}
</style>
<main>
  <div class="eyebrow">SMOKEY JADE · MOTION STUDY 01</div>
  <h1>提問卡｜文字揭露</h1>
  <p class="intro">點短、中、長三句，看卡片如何隨文字伸縮。下方為版型與動態試看，背景只是影片畫面示意。</p>
  <div class="frame" aria-label="十六比九提問卡動態預覽">
    <div class="ambient"></div><div class="frame-note">畫面示意 · 非正式影片</div>
    <div class="safe" id="safe"></div>
  </div>
  <div class="controls">
    <button data-i="0" aria-pressed="true">短句</button><button data-i="1" aria-pressed="false">中句</button><button data-i="2" aria-pressed="false">長句</button><button id="replay">重播</button>
    <span class="status" id="status">短句 · 8 字</span>
  </div>
  <div class="details"><span><strong>進場</strong>　遮罩揭露＋文字上移</span><span><strong>停留</strong>　完整清楚顯示</span><span><strong>退場</strong>　文字上移、卡片收回</span></div>
</main>
<script>
  const samples=["你真正想要什麼？","這段關係讓你感到安心嗎？","當對方沒有回應時，你心裡發生了什麼？"];
  const safe=document.getElementById('safe'),status=document.getElementById('status');
  let selected=0;
  function play(i=selected){selected=i;safe.replaceChildren();const card=document.createElement('div');card.className='card';
    const labelWrap=document.createElement('div');labelWrap.className='label-wrap';const label=document.createElement('div');label.className='label';label.textContent='A QUESTION TO HOLD';labelWrap.append(label);
    const questionWrap=document.createElement('div');questionWrap.className='question-wrap';const question=document.createElement('div');question.className='question';question.textContent=samples[i];questionWrap.append(question);
    const rule=document.createElement('div');rule.className='rule';card.append(labelWrap,questionWrap,rule);safe.append(card);
    status.textContent=['短句','中句','長句'][i]+' · '+Array.from(samples[i]).length+' 字';
    document.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.i)===i?'true':'false'));
  }
  document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>play(Number(b.dataset.i))));
  document.getElementById('replay').addEventListener('click',()=>play());play();
</script>
</html>
