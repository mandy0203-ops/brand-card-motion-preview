<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌提問卡｜五款動態試看</title>
<style>
:root{color-scheme:dark;background:#18211f;color:#f5f2e8;font-family:"Noto Sans CJK TC","PingFang TC",sans-serif}
*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1120px;margin:auto}
.eyebrow{color:#c98a5e;font-size:12px;letter-spacing:.25em;font-weight:700}
h1{font:700 clamp(26px,4vw,44px) "Noto Serif CJK TC",serif;margin:10px 0 8px}
.intro{color:#b7c3bd;line-height:1.7;margin:0 0 20px}
.picker-title{font-size:12px;color:#aebdb4;letter-spacing:.14em;margin:0 0 10px}
.presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:20px}
button{appearance:none;background:#30443e;color:#f5f2e8;border:1px solid #6b8177;border-radius:0;padding:10px 12px;font:600 14px "Noto Sans CJK TC","PingFang TC",sans-serif;cursor:pointer;text-align:left}
button:hover,button[aria-pressed="true"]{background:#f5f2e8;color:#24342e}
.no{display:block;font:600 11px "Helvetica Neue",sans-serif;letter-spacing:.2em;opacity:.65;margin-bottom:4px}
.name{display:block;font-size:15px}.note{display:block;font-size:11px;opacity:.72;margin-top:4px;font-weight:400}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(90% 120% at 65% 30%,#354840,#1b2723 62%,#111b18);border:1px solid #65756d}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.frame[data-background="photo"] .photo{display:block}.frame[data-background="photo"] .ambient{display:none}
.background-switch{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}
.background-switch span{font-size:12px;color:#aebdb4;letter-spacing:.14em;margin-right:6px}
.background-switch button{min-width:100px;text-align:center}
.ambient{position:absolute;right:12%;top:10%;width:22%;height:88%;border-radius:48% 48% 15% 15%;background:linear-gradient(90deg,#1b2b27,#465a50 40%,#263630);filter:blur(28px);opacity:.62}
.frame-note{position:absolute;right:3%;top:5%;color:#c6cec8;font:500 10px "Noto Sans CJK TC",sans-serif;letter-spacing:.15em;opacity:.7}
.safe{position:absolute;left:6%;bottom:14%;max-width:86%}
.card{width:max-content;max-width:100%;padding:22px;border:0;border-radius:0;box-shadow:none;overflow:hidden;animation:exit .45s ease-in 3.28s forwards}
.card[data-style="jade"]{background:radial-gradient(150% 130% at 18% 12%,rgba(96,124,115,.93),rgba(66,89,81,.92) 52%,rgba(48,66,59,.93));animation:reveal .46s ease-out both,exit .45s ease-in 3.28s forwards}
.card[data-style="ivory"]{background:#f5f2e8;animation:fade .35s ease-out both,exit .45s ease-in 3.28s forwards}
.card[data-style="plain"]{background:transparent;padding-left:0;padding-right:0;animation:fade .25s ease-out both,exit .45s ease-in 3.28s forwards}
.card[data-style="ink"]{background:#2e3e3a;animation:slide .55s cubic-bezier(.16,1,.3,1) both,exit .45s ease-in 3.28s forwards}
.card[data-style="umber"]{background:#8b4a2a;animation:fade .25s ease-out both,exit .45s ease-in 3.28s forwards}
.label-box,.text-box{overflow:hidden}.text-box{position:relative}
.label{font:600 clamp(10px,1.35vw,15px) "Helvetica Neue",Arial,sans-serif;letter-spacing:.4em;color:rgba(245,242,232,.78);white-space:nowrap;animation:up .5s ease-out .18s both}
.text{font:700 clamp(23px,3.35vw,38px)/1.25 "Noto Serif CJK TC","Songti TC",serif;letter-spacing:.03em;color:#fbf7ef;white-space:nowrap;margin-top:12px;animation:up .65s cubic-bezier(.16,1,.3,1) .33s both}
.rule{width:100%;height:2px;background:#c98a5e;margin-top:14px;transform-origin:left;animation:rule .5s ease-out .62s both}
.card[data-style="ivory"] .label{color:#4a635d}.card[data-style="ivory"] .text{color:#2e3e3a;animation:focus .85s ease-out .15s both}.card[data-style="ivory"] .rule{background:#8b4a2a}
.card[data-style="plain"] .label{color:#c98a5e}.card[data-style="plain"] .rule{background:#f5f2e8}
.card[data-style="ink"] .label{animation:left .58s ease-out .16s both}.card[data-style="ink"] .text{animation:right .65s ease-out .3s both}.card[data-style="ink"] .rule,.card[data-style="umber"] .rule{background:#f5f2e8}
.card[data-style="umber"] .text{animation:zoom .72s cubic-bezier(.16,1,.3,1) .22s both}
.ghost{visibility:hidden;animation:none!important}.piece{position:absolute;left:0;top:0;margin-top:12px}
.top{clip-path:inset(0 0 50% 0);animation:left .67s cubic-bezier(.16,1,.3,1) .25s both}
.bottom{clip-path:inset(50% 0 0 0);animation:right .67s cubic-bezier(.16,1,.3,1) .25s both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:translateX(-16px)}to{clip-path:inset(0);transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes up{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes focus{from{filter:blur(14px);opacity:0;transform:scale(1.035)}to{filter:blur(0);opacity:1;transform:scale(1)}}
@keyframes left{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes right{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes zoom{from{transform:scale(1.22);opacity:0;filter:blur(4px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes exit{to{clip-path:inset(0 0 0 100%);opacity:0}}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}.controls button{min-width:68px;text-align:center}
.status{margin-left:auto;color:#b7c3bd;font-size:13px}.details{display:flex;gap:28px;flex-wrap:wrap;color:#aebdb4;font-size:13px;line-height:1.7;margin-top:18px}.details strong{color:#f5f2e8}
@media(max-width:800px){.presets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){body{padding:18px}.card{padding:10px}.text{font-size:clamp(12px,3.35vw,24px);margin-top:5px}.piece{margin-top:5px}.label{font-size:8px}.rule{margin-top:6px;height:1px}.status{width:100%;margin-left:0}}
</style>
<main>
<div class="eyebrow">SMOKEY JADE · MOTION STUDIES</div>
<h1>品牌提問卡｜五款動態試看</h1>
<p class="intro">先選款式，再切換短、中、長句。可用同一張字卡對照示意背景和真實訪談畫面，檢查人物與字卡的比例。</p>
<p class="picker-title">選一款看看</p>
<div class="presets" role="group" aria-label="字卡款式">
<button data-style="jade" aria-pressed="true"><span class="no">01</span><span class="name">綠玻璃</span><span class="note">遮罩揭露</span></button>
<button data-style="ivory" aria-pressed="false"><span class="no">02</span><span class="name">象牙紙</span><span class="note">模糊聚焦</span></button>
<button data-style="plain" aria-pressed="false"><span class="no">03</span><span class="name">純文字</span><span class="note">上下分割</span></button>
<button data-style="ink" aria-pressed="false"><span class="no">04</span><span class="name">墨綠塊</span><span class="note">錯落滑入</span></button>
<button data-style="umber" aria-pressed="false"><span class="no">05</span><span class="name">暖根棕</span><span class="note">放大定格</span></button>
</div>
<div class="background-switch" role="group" aria-label="預覽背景"><span>預覽背景</span><button data-background="photo" aria-pressed="true">訪談實拍</button><button data-background="mock" aria-pressed="false">示意背景</button></div>
<div class="frame" id="frame" data-background="photo" aria-label="十六比九提問卡動態預覽"><img class="photo" src="./訪談實拍_文森_C0122.jpg" alt="文森訪談雙人實拍影格"><div class="ambient"></div><div class="frame-note" id="frame-note">文森訪談實拍 · 原片 16:9</div><div class="safe" id="safe"></div></div>
<div class="controls"><button data-i="0" aria-pressed="true">短句</button><button data-i="1" aria-pressed="false">中句</button><button data-i="2" aria-pressed="false">長句</button><button id="replay">重播</button><span class="status" id="status">綠玻璃 · 短句 · 8 字</span></div>
<div class="details"><span><strong>五款</strong>　同一品牌色系，不同材質與節奏</span><span><strong>文字</strong>　三種長度自動貼合寬度</span><span><strong>狀態</strong>　方向試看，尚未定稿</span></div>
</main>
<script>
const samples=["你真正想要什麼？","這段關係讓你感到安心嗎？","當對方沒有回應時，你心裡發生了什麼？"];
const names={jade:"綠玻璃",ivory:"象牙紙",plain:"純文字",ink:"墨綠塊",umber:"暖根棕"};
const safe=document.getElementById("safe"),status=document.getElementById("status");
const frame=document.getElementById("frame"),frameNote=document.getElementById("frame-note");
let selected=0,style="jade";
function play(i=selected,s=style){
  selected=i;style=s;safe.replaceChildren();
  const card=document.createElement("div");card.className="card";card.dataset.style=s;
  const labelBox=document.createElement("div");labelBox.className="label-box";
  const label=document.createElement("div");label.className="label";label.textContent="A QUESTION TO HOLD";labelBox.append(label);
  const textBox=document.createElement("div");textBox.className="text-box";
  const question=document.createElement("div");question.className="text";question.textContent=samples[i];
  if(s==="plain"){
    question.classList.add("ghost");textBox.append(question);
    for(const part of ["top","bottom"]){const piece=document.createElement("div");piece.className="text piece "+part;piece.textContent=samples[i];textBox.append(piece)}
  }else textBox.append(question);
  const rule=document.createElement("div");rule.className="rule";card.append(labelBox,textBox,rule);safe.append(card);
  status.textContent=names[s]+" · "+["短句","中句","長句"][i]+" · "+Array.from(samples[i]).length+" 字";
  document.querySelectorAll("[data-i]").forEach(b=>b.setAttribute("aria-pressed",Number(b.dataset.i)===i?"true":"false"));
  document.querySelectorAll("[data-style]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.style===s?"true":"false"));
}
document.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>play(Number(b.dataset.i))));
document.querySelectorAll(".presets [data-style]").forEach(b=>b.addEventListener("click",()=>play(selected,b.dataset.style)));
document.querySelectorAll(".background-switch [data-background]").forEach(b=>b.addEventListener("click",()=>{
  frame.dataset.background=b.dataset.background;
  frameNote.textContent=b.dataset.background==="photo"?"文森訪談實拍 · 原片 16:9":"畫面示意 · 非正式影片";
  document.querySelectorAll(".background-switch [data-background]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  play();
}));
document.getElementById("replay").addEventListener("click",()=>play());
play();
</script>
</html>
