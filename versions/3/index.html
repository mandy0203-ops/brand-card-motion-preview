<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌字卡 V3｜煙霧漸層</title>
<style>
:root{font-family:"Noto Sans CJK TC","PingFang TC",sans-serif;color:#F5F2E8;background:#1C2925}*{box-sizing:border-box}
body{margin:0;padding:24px}main{max-width:1120px;margin:auto}
header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:18px}h1{font:700 clamp(25px,3.2vw,39px) "Noto Serif CJK TC","Songti TC",serif;margin:0 0 6px}header p{font-size:13px;color:#D0DDD9;margin:0;line-height:1.6}.edition{font:700 12px Arial,sans-serif;letter-spacing:.18em;color:#F9ECC3;white-space:nowrap}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#2E3E3A;isolation:isolate}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage[data-background="plain"] .photo{display:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 78% 51% at 50% 90%,rgba(27,42,37,var(--smoke,.94)) 0%,rgba(36,55,48,.75) 45%,rgba(36,55,48,0) 100%),linear-gradient(0deg,rgba(20,31,27,.43),transparent 38%)}
.stage[data-kind="question"]::after{background:radial-gradient(ellipse 68% 55% at 28% 88%,rgba(27,42,37,var(--smoke,.94)) 0%,rgba(36,55,48,.65) 48%,rgba(36,55,48,0) 100%),linear-gradient(0deg,rgba(20,31,27,.30),transparent 38%)}
.stage[data-kind="note"]::after{background:radial-gradient(ellipse 62% 66% at 75% 83%,rgba(27,42,37,var(--smoke,.94)) 0%,rgba(36,55,48,.7) 48%,rgba(36,55,48,0) 100%),linear-gradient(0deg,rgba(20,31,27,.28),transparent 38%)}
.scene-note{position:absolute;top:4%;left:4%;z-index:2;padding:4px 7px;background:rgba(46,62,58,.9);color:#F5F2E8;font:600 10px Arial,sans-serif;letter-spacing:.08em}.stage[data-background="plain"] .scene-note{display:none}
.layout{position:absolute;z-index:2;color:#F5F2E8;text-shadow:0 1px 2px rgba(15,23,20,.25)}
.layout[data-kind="quote"]{left:16%;bottom:11%;width:68%;text-align:center}.layout[data-kind="question"]{left:7%;bottom:11%;width:59%;text-align:left}.layout[data-kind="note"]{right:5.5%;bottom:11%;width:45%;text-align:left}
.layout::before,.layout::after{content:"";position:absolute;width:20px;height:20px;pointer-events:none}.layout::before{left:-5%;top:-8%;border-top:1px solid #D0DDD9;border-left:1px solid #D0DDD9}.layout::after{right:-5%;bottom:-10%;border-bottom:1px solid #D0DDD9;border-right:1px solid #D0DDD9}
.eyebrow{font:700 clamp(8px,1vw,12px) Arial,sans-serif;letter-spacing:.3em;color:#F9ECC3;margin:0 0 17px}.title{font:700 clamp(20px,2.8vw,32px)/1.45 "Noto Serif CJK TC","Songti TC",serif;letter-spacing:.03em;margin:0;text-wrap:balance}.body{font:500 clamp(14px,1.8vw,21px)/1.58 "Noto Serif CJK TC","Songti TC",serif;letter-spacing:.025em;margin:14px 0 0;text-wrap:pretty}.layout[data-kind="quote"] .body,.layout[data-kind="question"] .body{display:none}.layout[data-kind="note"] .eyebrow{margin-bottom:11px}.layout[data-kind="note"] .title{font-size:clamp(19px,2.4vw,27px)}
.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{appearance:none;border:1px solid #6B8F88;background:#273A34;color:#F5F2E8;padding:9px 13px;font:600 13px "Noto Sans CJK TC",sans-serif;cursor:pointer}button[aria-pressed="true"]{background:#F5F2E8;color:#2E3E3A}.controls{margin-top:9px}.controls button{font-size:12px}
.editor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 20px;margin-top:22px;padding-top:17px;border-top:1px solid #6B8F88}.control label{display:flex;justify-content:space-between;gap:9px;font-size:13px;margin-bottom:5px}.control output{color:#F9ECC3}.control input{width:100%;accent-color:#F9ECC3}.feedback{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.feedback input{flex:1;min-width:260px;background:#F5F2E8;border:0;padding:9px;font:14px "Noto Sans CJK TC",sans-serif}.status{font-size:12px;color:#F9ECC3}.explain{font-size:13px;line-height:1.7;color:#D0DDD9;margin-top:15px}
@media(max-width:700px){body{padding:14px}header{display:block}.edition{display:block;margin-top:8px}.scene-note{font-size:6px;padding:2px 3px}.layout::before,.layout::after{width:8px;height:8px}.eyebrow{font-size:5px;margin-bottom:5px;letter-spacing:.16em}.title{font-size:clamp(9px,2.3vw,15px);line-height:1.3}.body{font-size:clamp(7px,1.5vw,11px);margin-top:4px;line-height:1.3}.layout[data-kind="note"] .title{font-size:clamp(9px,2vw,14px)}.layout[data-kind="quote"],.layout[data-kind="question"],.layout[data-kind="note"]{bottom:10%}.editor{grid-template-columns:1fr 1fr}}
</style>
<main>
<header><div><h1>品牌字卡 V3｜煙霧漸層</h1><p>取自參考資料夾 D 系列的留白、局部深綠漸層與細角標；獨立試作。</p></div><span class="edition">DIRECTION 03</span></header>
<div class="stage" id="stage" data-kind="quote" data-background="photo"><img class="photo" src="./訪談實拍_文森_C0122.jpg" alt="雙人訪談實拍影格"><div class="scene-note">訪談實拍 · 示範文字非本段原話</div><div class="layout" id="layout" data-kind="quote"><p class="eyebrow" id="eyebrow"></p><p class="title" id="title"></p><p class="body" id="body-copy"></p></div></div>
<div class="tabs" role="group" aria-label="字卡類型"><button data-kind="quote" aria-pressed="true">金句 · 雙人</button><button data-kind="question" aria-pressed="false">提問 · 左下</button><button data-kind="note" aria-pressed="false">小叮嚀 · 右下</button></div>
<div class="controls" role="group" aria-label="預覽選項"><button data-length="long" aria-pressed="true">長句</button><button data-length="medium" aria-pressed="false">中句</button><button data-length="short" aria-pressed="false">短句</button><button data-background="photo" aria-pressed="true">訪談畫面</button><button data-background="plain" aria-pressed="false">純色畫面</button></div>
<div class="editor"><div class="control"><label for="smoke">煙霧深度 <output id="smoke-value">94%</output></label><input id="smoke" type="range" min="40" max="100" value="94"></div><div class="control"><label for="text-size">文字大小 <output id="text-size-value">100%</output></label><input id="text-size" type="range" min="70" max="130" value="100"></div><div class="control"><label for="position">上下位置 <output id="position-value">11%</output></label><input id="position" type="range" min="4" max="32" value="11"></div></div>
<div class="feedback"><input id="request" type="text" placeholder="還想怎麼改？例如：漸層再淡、字卡往右"><button id="copy" type="button">複製修改指令</button><span class="status" id="status" role="status"></span></div>
<p class="explain">這是第三版的視覺方向，未使用資料夾內的示意人物或原圖作為影片素材。第一版五款動態與第二版 Keynote 金句卡各自保留；此頁不會改動剪輯時間線。</p>
</main>
<script>
const samples={quote:{long:["當發現可以改善的事情，最該高興的，是不用再抱持著錯誤的想法，繼續生活下去。",""],medium:["理解，是靠近彼此的第一步。",""],short:["先聽，再說。",""]},question:{long:["你上一次被好好聽見，是什麼時候？",""],medium:["什麼讓你感到安心？",""],short:["你在意什麼？",""]},note:{long:["練習題記得做","把握住每個小練習題，不僅能更好地梳理想法，也能發現關係中潛在的卡點。"],medium:["練習題記得做","花幾分鐘寫下來，會看見新的線索。"],short:["練習題記得做","先從一個小問題開始。"]}};
const labels={quote:"金句 · WORTH REMEMBERING",question:"想一想 · PAUSE & REFLECT",note:"貼心小叮嚀 · NOTE"};
const stage=document.getElementById("stage"),layout=document.getElementById("layout"),eyebrow=document.getElementById("eyebrow"),title=document.getElementById("title"),body=document.getElementById("body-copy"),status=document.getElementById("status");
let kind="quote",length="long",background="photo";
function render(){stage.dataset.kind=kind;layout.dataset.kind=kind;stage.dataset.background=background;eyebrow.textContent=labels[kind];[title.textContent,body.textContent]=samples[kind][length];const size=Number(document.getElementById("text-size").value)/100;title.style.fontSize=Math.max(8,(kind==="note"?27:32)*stage.clientWidth/1120*size)+"px";body.style.fontSize=Math.max(7,21*stage.clientWidth/1120*size)+"px";layout.style.bottom=document.getElementById("position").value+"%";stage.style.setProperty("--smoke",document.getElementById("smoke").value/100);for(const key of ["smoke","text-size","position"])document.getElementById(key+"-value").textContent=document.getElementById(key).value+"%";document.querySelectorAll("button[data-kind]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.kind===kind)));document.querySelectorAll("button[data-length]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.length===length)));document.querySelectorAll("button[data-background]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.background===background)))}
document.querySelectorAll("button[data-kind]").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;render()}));document.querySelectorAll("button[data-length]").forEach(b=>b.addEventListener("click",()=>{length=b.dataset.length;render()}));document.querySelectorAll("button[data-background]").forEach(b=>b.addEventListener("click",()=>{background=b.dataset.background;render()}));for(const key of ["smoke","text-size","position"])document.getElementById(key).addEventListener("input",render);
document.getElementById("copy").addEventListener("click",async()=>{const extra=document.getElementById("request").value.trim();const msg=`請依品牌字卡第三版「煙霧漸層」的預覽修改：類型 ${kind}、句長 ${length}、煙霧深度 ${document.getElementById("smoke").value}%、文字大小 ${document.getElementById("text-size").value}%、距底部 ${document.getElementById("position").value}%。${extra?"另外："+extra:""}請保留第一版五款和第二版 Keynote 金句卡。`;try{await navigator.clipboard.writeText(msg)}catch{const t=document.createElement("textarea");t.value=msg;document.body.append(t);t.select();if(!document.execCommand("copy")){t.remove();status.textContent="瀏覽器未允許複製，請手動輸入。";return}t.remove()}status.textContent="已複製，回到對話貼上即可。"});new ResizeObserver(render).observe(stage);render();
</script>
</html>
